services:
  n8n:
    image: n8nio/n8n:2.38.6
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN in the untracked .env file}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_RUNNERS_EXTERNAL_ALLOW=yt_dlp
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - N8N_RUNNERS_TASK_TIMEOUT=1800
    volumes:
      - n8n_data:/home/node/.n8n
      - video_data:/files

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN in the untracked .env file}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_TASK_TIMEOUT=1800
    volumes:
      - video_data:/files
      - ./output:/exports
    depends_on:
      - n8n

  whisper:
    build:
      context: .
      dockerfile: WhisperDockerfile
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - video_data:/files

volumes:
  n8n_data:
  video_data: